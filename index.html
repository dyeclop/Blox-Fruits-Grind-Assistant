<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruits Grinding Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>🏴‍☠️ Blox Fruits Grind Optimizer</h1>
        <p>Calculate exact EXP and optimal quest runs instantly.</p>
        
        <div class="input-group">
            <label for="startLevel">Current Level:</label>
            <input type="number" id="startLevel" min="1" max="700" value="350">
        </div>

        <div class="input-group">
            <label for="targetLevel">Target Level:</label>
            <input type="number" id="targetLevel" min="1" max="700" value="375">
        </div>

        <button id="calculateBtn">Optimize Route</button>

        <div id="results" class="results-container hidden">
            <div class="summary-card">
                <h2>Total EXP Needed: <span id="totalXpDisplay">0</span></h2>
            </div>
            <div id="roadmap"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
